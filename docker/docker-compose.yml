# One-command local full stack (docs/07 §4: make up). M1: mediamtx loops the 3 demo
# clips as RTSP; vision workers run the fast path per camera. Agent service added at M3.
services:
  mediamtx:
    image: bluenviron/mediamtx:1.9.3-ffmpeg   # -ffmpeg variant for runOnDemand looping
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
      - ../assets/clips:/clips:ro
    ports:
      - "8554:8554"   # RTSP
      - "8889:8889"   # WebRTC
    networks: [internal]

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "no"]
    networks: [internal]

  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_USER: sitewatch
      POSTGRES_PASSWORD: sitewatch
      POSTGRES_DB: sitewatch
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [internal]

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    environment:
      DATABASE_URL: postgresql://sitewatch:sitewatch@postgres:5432/sitewatch
      # Same volume the agent service writes evidence into (below) -- read-only
      # here since the API only serves clip.mp4/tracks.jsonl, never writes them.
      WORKSPACE_ROOT: /workspace
    volumes:
      - agent_workspace:/workspace:ro
    ports:
      - "8000:8000"
    depends_on: [postgres, redis]
    networks: [internal]

  # Slow-path agent worker (M3/M4): consumes trigger_events, drives prime-agent,
  # persists confirmed/needs_review IncidentRecords. Harness state (prime-agent's
  # own auth/session data) mounts from the host so the container reuses the same
  # verified local install docker/vendor/README.md describes -- there's no
  # containerized auth flow yet.
  agent:
    build:
      context: ..
      dockerfile: docker/Dockerfile.agent
    environment:
      REDIS_URL: redis://redis:6379
    command:
      ["/app/.venv/bin/python3", "-m", "agent.worker",
       "--redis-url", "redis://redis:6379",
       "--postgres-dsn", "postgresql://sitewatch:sitewatch@postgres:5432/sitewatch",
       "--workspace-root", "/workspace",
       "--evidence-root", "/workspace/incidents"]
    volumes:
      - agent_workspace:/workspace
      - ${PRIME_HARNESS_DIR:-~/.prime}:/home/node/.prime
    depends_on: [redis, postgres]
    networks: [internal]

  # Fast-path workers, one per camera (docs/02 §7: one vision worker per stream,
  # camera→worker via config). GPU passthrough verified on this host (spike-00).
  vision-dock:
    build: &vision-build
      context: ..
      dockerfile: docker/Dockerfile.vision
    image: sitework-vision:latest   # all three workers share this one image
    environment: &vision-env
      REDIS_URL: redis://redis:6379
    volumes: &vision-volumes
      - ../data/models:/models:ro
    command: ["python3", "-m", "pipelines.vision.pipeline",
              "--camera-id", "dock_north_01",
              "--url", "rtsp://mediamtx:8554/dock_north_01"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    depends_on: [redis, mediamtx]
    networks: [internal]

  vision-aisle:
    build: *vision-build
    image: sitework-vision:latest
    environment: *vision-env
    volumes: *vision-volumes
    command: ["python3", "-m", "pipelines.vision.pipeline",
              "--camera-id", "warehouse_aisle_01",
              "--url", "rtsp://mediamtx:8554/warehouse_aisle_01"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    depends_on: [redis, mediamtx]
    networks: [internal]

  vision-yard:
    build: *vision-build
    image: sitework-vision:latest
    environment: *vision-env
    volumes: *vision-volumes
    command: ["python3", "-m", "pipelines.vision.pipeline",
              "--camera-id", "yard_excavator_01",
              "--url", "rtsp://mediamtx:8554/yard_excavator_01"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    depends_on: [redis, mediamtx]
    networks: [internal]

  ui:
    image: node:20.18-bookworm-slim
    working_dir: /app
    volumes:
      - ../ui:/app
    command: sh -c "npm install && npm run dev"
    ports:
      - "5173:5173"
    depends_on: [api]
    networks: [internal]

networks:
  internal:

volumes:
  pgdata:
  agent_workspace:
