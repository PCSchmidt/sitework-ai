[project]
name = "sitework-ai"
version = "0.1.0"
description = "SiteWatch AI — hybrid deterministic/probabilistic industrial safety telemetry"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "websockets>=13.0",
    "redis>=5.0",
    "asyncpg>=0.29",
    "av>=13.0",
    "numpy>=1.26",
    "ultralytics>=8.3",
    "shapely>=2.0",
    "torch==2.11.0+cu128",
    "torchvision==0.26.0+cu128",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    "httpx>=0.27",
    "types-PyYAML>=6.0",
    "fakeredis>=2.38",
]

[tool.uv]
package = false

# CUDA-enabled torch/torchvision for the local GPU (RTX A4500, Ampere).
# CI uses CPU-only fixtures and does not install this environment's torch.
[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["pipelines", "agent", "api", "evaluation", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = ["."]
files = ["pipelines", "agent", "api"]

# Third-party libs without stubs (mypy follows but doesn't type-fail them)
[[tool.mypy.overrides]]
module = ["ultralytics", "av", "torch", "shapely.*", "asyncpg"]
ignore_missing_imports = true

# Ultralytics' track()/predict() return Tensor|ndarray unions that strict mode
# can't narrow; vision modules sit behind schema-typed boundaries (TrackletFrame),
# so loosen checks there rather than peppering casts.
[[tool.mypy.overrides]]
module = ["pipelines.vision.*", "pipelines.ingestion.*"]
disable_error_code = ["union-attr", "no-any-return", "no-untyped-call", "index", "assignment", "attr-defined"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "-q"
markers = [
    "integration: requires a real Postgres (TEST_DATABASE_URL); skipped if unset/unreachable",
]
