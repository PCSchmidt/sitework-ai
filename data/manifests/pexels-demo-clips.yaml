name: pexels-demo-clips
version: "2026-09-16 selection"
url: https://www.pexels.com/license/   # Pexels license: free to use, no attribution required
license: Pexels License
redistribution: allowed   # Pexels license permits use/modification; do not sell unaltered copies
gated: false
downloaded: 2026-09-16
local_path: assets/clips
content:
  type: stock video clips (mp4, h264)
use_in_project:
  - one-command demo feeds via MediaMTX loop (docker/mediamtx.yml streams the *_1080p files)
  - multi-stream benchmark inputs (S2)
# The originals are what Pexels serves. The stack streams the *_1080p transcodes, because
# spike-00 found native-4K decode (not inference) was the throughput wall. The exact ffmpeg
# arguments used on 2026-09-16 were not recorded; an equivalent transcode is:
#   ffmpeg -i <clip>.mp4 -vf scale=1920:1080 -r 25 -c:v libx264 -an <clip>_1080p.mp4
# That produces a pipeline-compatible 1080p/25fps H.264 file, but its hash will differ from
# the *_1080p sha256 values below (those are the files the published benchmarks ran on).
# Hashes recorded 2026-09-26.
clips:
  - file: forklift_workers_interaction.mp4
    source: https://www.pexels.com/video/warehouse-operations-with-forklift-and-workers-32243654/
    role: camera dock_north_01 — flagship forklift/pedestrian proximity demo
    tech: 3840x2160 @ 25 fps, 12.2 s
    sha256: 14eed937305180534a9b8bae674f7f3fde28586f4259189c7fb4df28a618127c
    transcode:
      file: forklift_workers_interaction_1080p.mp4
      tech: 1920x1080 @ 25 fps, 12.2 s
      sha256: 35bfd23410c9cadb2fefbb9ceb82fc5398025153de5498aa84f7d3e57860f567
    notes: person + forklift share frame at close range; wide shot, calibratable
  - file: worker_walking_aisle.mp4
    source: https://www.pexels.com/video/warehouse-storage-with-worker-walking-38707991/
    role: camera warehouse_aisle_01 — walkway intrusion / wrong-way / dwell rules
    tech: 3840x2160 @ 25 fps, 24.7 s
    sha256: 4c030e05a48f9ba029b10f04114f6ab45f476eb67c7a9d368909bbda38fe9d35
    transcode:
      file: worker_walking_aisle_1080p.mp4
      tech: 1920x1080 @ 25 fps, 24.7 s
      sha256: 27a14de0b51069a9da475d9d21aa833b4baedf58f216031a530ecc474d1aedee
  - file: excavator_site_01.mp4
    source: https://www.pexels.com/video/excavator-working-at-construction-12007917/
    role: camera yard_excavator_01 — swing-radius zone; second S2 benchmark stream
    tech: 1920x1080 @ 25 fps, 19.0 s
    sha256: a0aadfc29a904b41660c60007ca8f8d84b6b5a9472b07980d57c4cecd309fc1d
    transcode:
      file: excavator_site_01_1080p.mp4   # already 1080p upstream; re-encoded for a uniform set
      tech: 1920x1080 @ 25 fps, 19.0 s
      sha256: e06c2ab7f3881d3739245787c7c9ed81a76a07cb8ea0c29bde2e41c8ae40ff37
  - file: forklift_worker_02.mp4
    source: https://www.pexels.com/video/man-with-orange-helmet-getting-into-forklift-5100048/
    role: spare; intended for a PPE demo, which was never built (docs/04 §2); 4th stream for scaling tests
    tech: 3840x2160 @ 30 fps, 26.0 s — hard hat + hi-vis vest clearly visible
    sha256: 73612d161d68bfce7edb6220688e84cbff7ddf1b3f305be571c83950051683e3
not_selected:
  - forklift_warehouse_01.mp4   # machinery-only, no pedestrians
  - forklift_construction_workers.mp4   # crop too tight, no ground plane
  - excavator_site_02.mp4   # kept on disk as extra benchmark stream only (sha256 d7d01404faef54de75ef4b0d8c1119b95c633861d3480c9430b789dbf449d273)
notes: >
  Clips are git-ignored (*.mp4), so a fresh clone has none of them: download each `source`
  URL above into assets/clips/ and make the *_1080p transcodes before `make up`. Preview
  frames live in assets/clips/_preview/ (also git-ignored). If the repo ever commits demo
  video, prefer short transcoded excerpts with this manifest's source links for attribution.
