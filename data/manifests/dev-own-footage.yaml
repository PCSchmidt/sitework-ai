notes: >
  Clips are git-ignored (*.mp4), same as the Pexels set -- the raw video never
  enters git history, only this manifest and the derived calibration numbers
  (config/calibration/dining_room_01.json) do. Calibration from this footage
  FAILS the hard RMS gate (valid=false, rms_px~105 vs RMS_GATE_PX=2.0) --
  real hand-picked lines from a phone photo aren't survey-grade precision.
  That's the expected, honest outcome, not a bug: it demonstrates
  zone_intrusion correctly still firing (zone containment tolerates the
  imprecision) while proximity/speed correctly stay inert (docs/04 §3
  degrade-to-zone-only), end-to-end, for the first time with real (not
  synthetic) data.
