name: YOLO11 COCO-pretrained detectors (Ultralytics)
version: "ultralytics v8.3.0 release assets (yolo11s.pt default, yolo11n.pt fallback)"
url: https://github.com/ultralytics/ultralytics
license: AGPL-3.0-or-later   # Ultralytics code and weights; see note below
redistribution: research-only   # weights cached locally (git-ignored), never committed
gated: false
downloaded: 2026-09-16
local_path: data/models   # mounted read-only into the vision containers at /models
use_in_project:
  - yolo11s.pt — default detector (spike-00, ADR-003); Dockerfile.vision sets YOLO_WEIGHTS=/models/yolo11s.pt
  - yolo11n.pt — fallback / spike-00 comparison baseline
  - TensorRT FP16 engines (yolo11{n,s}.engine) exported from these at M5 for docs/benchmarks.md
notes: >
  Ultralytics ships under AGPL-3.0. This repo's own code is MIT, but running the vision
  worker pulls in Ultralytics, so the AGPL applies to that combination; the README's
  License section says so. Any commercial or hosted-service use would need an Ultralytics
  Enterprise license or a permissively licensed detector instead.

  The vision containers mount data/models read-only, so they cannot auto-download weights.
  Fetch them onto the host first, e.g.:
    curl -L -o data/models/yolo11s.pt https://github.com/ultralytics/assets/releases/download/v8.3.0/yolo11s.pt
  and check the hash against the entry below. The .engine files are compiled for one
  specific GPU + TensorRT version and are not portable, so they are not hashed here;
  rebuild them with model.export(format="engine", half=True) (docs/04 §2).
