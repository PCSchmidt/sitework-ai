# Publishes the recorded demo dashboard to GitHub Pages
# (https://pcschmidt.github.io/sitework-ai/).
#
# The static build (VITE_STATIC_DEMO=1) has no API or WebSocket: incidents,
# KPIs, and camera recordings all come from ui/public/showcase/, which
# pipelines/vision/record.py and scripts/showcase_agent.py generate offline
# (GPU + real prime-agent runs). This job only builds and uploads files.
name: pages

on:
  push:
    branches: [main]
    paths:
      - "ui/**"
      - ".github/workflows/pages.yaml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          VITE_STATIC_DEMO: "1"
          VITE_BASE: /sitework-ai/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ui/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
