name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    # M4: real Postgres for the api/repository/worker-persistence integration
    # tests (tests/test_repository.py, tests/test_api.py, the
    # @pytest.mark.integration case in tests/test_worker.py). Those tests
    # skip cleanly without this (tests/conftest.py's pg_pool fixture), but
    # CI actually has a DB available, so it runs them for real rather than
    # letting them silently skip forever.
    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_USER: sitewatch
          POSTGRES_PASSWORD: sitewatch
          POSTGRES_DB: sitewatch
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - run: uv sync --frozen || uv sync
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pytest
        env:
          TEST_DATABASE_URL: postgresql://sitewatch:sitewatch@localhost:5432/sitewatch
      - name: M0.5 doc-consistency checks
        run: uv run python scripts/check_docs.py
      - name: Schema export is up to date
        run: |
          uv run python -m pipelines.schemas.export
          git diff --exit-code schemas/

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile || pnpm install
      - run: pnpm test
      - run: pnpm build

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker compose config validity
        run: docker compose -f docker/docker-compose.yml config -q
