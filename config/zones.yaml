# Ground-plane zones in meters (docs/06 §7). Polygons are filled by the calibration
# tool workflow (make calib); values below are plausible placeholders for the demo site plan.
zones:
  - id: dock_north
    camera_id: dock_north_01
    kind: dock_apron
    active: true
    min_calibration_quality: 2.0
    polygon_m: [[0.0, 0.0], [20.0, 0.0], [20.0, 12.0], [0.0, 12.0]]
  - id: pedestrian_walkway_north
    camera_id: dock_north_01
    kind: pedestrian_walkway
    active: true
    min_calibration_quality: 2.0
    polygon_m: [[0.0, 12.0], [20.0, 12.0], [20.0, 15.0], [0.0, 15.0]]
  - id: excavator_swing_radius
    camera_id: yard_excavator_01
    kind: swing_radius
    active: true
    min_calibration_quality: 2.0
    polygon_m: [[8.0, 8.0], [16.0, 8.0], [16.0, 16.0], [8.0, 16.0]]
  # Calibration test fixture (see config/cameras.yaml dining_room_01). Polygon
  # is the real rug/floor area near the room corner, computed by projecting
  # its pixel-space bounding box through config/calibration/dining_room_01.json
  # -- ground_intrusion works despite that calibration failing the hard gate
  # (zone containment tolerates the imprecision; proximity/speed wouldn't).
  - id: dining_room_test_zone
    camera_id: dining_room_01
    kind: generic
    active: true
    min_calibration_quality: 2.0
    polygon_m: [[2.659, 2.099], [3.228, 0.750], [1.703, 0.405], [1.370, 1.112]]
